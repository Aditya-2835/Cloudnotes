apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudnotes-app
  template:
    metadata:
      labels:
        app: cloudnotes-app
    spec:
      containers:
        - name: app
          image: cloudnotes:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: "cloudnotes-db"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudnotes-app
spec:
  type: NodePort
  selector:
    app: cloudnotes-app
  ports:
    - port: 5000
      targetPort: 5000
