services:
  app:
    build: .
    container_name: cloudnotes-app
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: cloudnotes-db
    environment:
      - POSTGRES_USER=cloudnotes
      - POSTGRES_PASSWORD=devpassword123
      - POSTGRES_DB=cloudnotesdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnotes -d cloudnotesdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
